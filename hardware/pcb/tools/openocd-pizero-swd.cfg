# OpenOCD config: Raspberry Pi Zero / Zero W (BCM2835) as a bit-banged SWD probe for the RAK4630 adapter.
# Written 2026-10-20 for first-time provisioning of the RAK4630 stamps (see ../BRING-UP.md, RAK adapter step 4).
# Needs OpenOCD 0.12+ (Raspberry Pi OS Bookworm: sudo apt install openocd). Run with sudo.
#
# Wiring (Pi header pin numbers -> RAK adapter interface rows). The RAK is powered from the bench 3.30 V
# on row A pin 2. Do NOT connect the Pi's 3V3. Keep the wires short (< 15 cm).
#   Pi pin 22 (GPIO25)  -> row C pin 4  SWDCLK
#   Pi pin 18 (GPIO24)  -> row C pin 5  SWDIO
#   Pi pin 20 (GND)     -> row C pin 1  GND
#   (optional) Pi pin 12 (GPIO18) -> row C pin 3 nRESET   - not needed for SWD on the nRF52
#
# Typical use:
#   sudo openocd -f openocd-pizero-swd.cfg -c "init; mdw 0x10000104; exit"            # FICR INFO.VARIANT
#   sudo openocd -f openocd-pizero-swd.cfg -c "init; nrf52_recover; exit"             # only if the AP is locked
#   sudo openocd -f openocd-pizero-swd.cfg -c "init; halt; nrf5 mass_erase; program <bootloader_s140_6.1.1>.hex verify; reset; exit"

adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0x20000000   ;# BCM2835 (Pi Zero / Pi 1). Pi 2/3: 0x3F000000, Pi 4: 0xFE000000
bcm2835gpio speed_coeffs 113714 28       ;# Pi Zero timing coefficients from OpenOCD's raspberrypi-native.cfg

adapter gpio swclk 25
adapter gpio swdio 24
# adapter gpio srst 18                    ;# uncomment if you wire nRESET; then: reset_config srst_only srst_push_pull

transport select swd
adapter speed 1000                        ;# kHz. Direct short wires to the adapter rows, no bulkhead filters in the path.

source [find target/nrf52.cfg]
