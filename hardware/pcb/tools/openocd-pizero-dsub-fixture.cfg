# OpenOCD: Raspberry Pi Zero as SWD probe through the LTE-side D-sub (PROVISIONING-FIXTURE.md).
# Same as openocd-pizero-swd.cfg, but slow (470 ohm + ~2.2 nF in every line) and with nRESET open-drain.
# OpenOCD 0.12+. Run with sudo. If OpenOCD rejects a line, keep the error and `openocd --version`.

adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0x20000000   ;# BCM2835 (Pi Zero / Pi 1). Pi 2/3: 0x3F000000, Pi 4: 0xFE000000
bcm2835gpio speed_coeffs 113714 28

adapter gpio swclk 25                     ;# Pi pin 22 -> DE-9 pin 4
adapter gpio swdio 24                     ;# Pi pin 18 -> DE-9 pin 5
adapter gpio srst 18 -active-low -open-drain   ;# Pi pin 12 -> DE-9 pin 3 (LORA_nRESET is open-drain only)
reset_config srst_only srst_open_drain

transport select swd
adapter speed 100                         ;# kHz. Raise in steps (150, 200, 300) and record the highest that verifies.

source [find target/nrf52.cfg]
