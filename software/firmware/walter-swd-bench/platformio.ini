; Walter SWD bench tool: the Walter provisions a factory RAK4630 (RUI3) with the bootloader +
; SoftDevice S140 6.1.1, through the production D-sub chain. A bench tool, not the Walter's production
; firmware. See README.md.
;
; Build + flash:  pio run -t upload        (Walter's own USB-C: native ESP32-S3 USB-Serial/JTAG)
; Console:        pio device monitor
; Image:          images/*.hex is built in by tools/hex2image.py on every build.

[platformio]
default_envs = walter

[env:walter]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1        ; Walter = ESP32-S3-WROOM-1 (N16R2); the generic S3 board is enough here
framework = arduino
build_flags =
  -D ARDUINO_USB_MODE=1           ; USB-Serial/JTAG
  -D ARDUINO_USB_CDC_ON_BOOT=1    ; Serial = the Walter's USB-C
extra_scripts = pre:tools/hex2image.py
monitor_speed = 115200
monitor_echo = no                 ; the tool echoes
monitor_eol = CRLF
