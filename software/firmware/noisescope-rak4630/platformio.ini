; NoiseScope — SX1262 spectrum/noise scanner firmware for the TwinOak RAK4630 adapter
;
; Build:   pio run
; Output:  .pio/build/rak4630/firmware.hex  (flash via Walter SWD or adafruit-nrfutil DFU)
;
; RadioLib and the Adafruit nRF52 core are pinned to the exact commits MeshCore
; pins, so the Arduino core and radio behaviour (RSSI path, AGC, boosted gain)
; are identical between the two firmwares you swap on a repeater.

[platformio]
default_envs = rak4630

[env:rak4630]
platform = nordicnrf52
board = rak4631                  ; boards/rak4631.json (RAK4630 stamp == RAK4631 core, same pin map)
framework = arduino
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino.git#d541301
monitor_speed = 115200
build_flags =
  -Wl,-u,_printf_float           ; enable %f in snprintf (newlib-nano)
  -I variants/rak4631
  ; --- overridable defaults, see src/config.h for the full list ---
  ;-D HOME_FREQ_MHZ=869.618
  ;-D HOME_BW_KHZ=62.5
  ;-D HOME_SF=8
  ;-D HOME_CR=8
  ;-D WALTER_BAUD=115200
build_src_filter = +<*> +<../variants/rak4631>
lib_deps =
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
